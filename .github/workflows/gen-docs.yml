name: Gen Docs

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
      - 'src/builtins/**'
      # `member_aliases` for api.json.
      - 'src/sema.zig'
      - 'examples/web-playground/**'
      - 'src/lsp/**'
      - '.github/workflows/gen-docs.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      ZIG_VERSION: 0.17.1
    steps:
      - name: Clone repo.
        uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Install zig.
        run: |
          wget -c https://ziglang.org/download/${{ env.ZIG_VERSION }}/zig-x86_64-linux-${{ env.ZIG_VERSION }}.tar.xz -O - | tar -xJ --strip-components=1 -C /usr/local/bin

      - name: Build md4c.
        run: |
          git clone --depth=1 https://github.com/mity/md4c.git
          cd md4c
          mkdir build
          cd build
          cmake ..
          make

      # Dependencies of build.zig.zon are fetched into zig-pkg. Restoring them before the first `zig build` keeps a
      # build from failing when the host of a dependency (codeberg.org) is down.
      # build.zig.zon also holds the version, so a release commit changes the key. `restore-keys` then restores the
      # newest older cache: a package directory is named by its content hash, so an older cache is still correct
      # and only a changed dependency is fetched.
      - name: Cache Zig packages.
        uses: actions/cache@v5
        with:
          path: zig-pkg
          key: zig-pkg-${{ runner.os }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-pkg-${{ runner.os }}-

      # No network access when the cache was restored. Otherwise the fetch is retried, the host can be slow.
      - name: Fetch Zig packages.
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if zig build --fetch; then
              exit 0
            fi
            echo "zig build --fetch failed (attempt $attempt)."
            sleep $((attempt * 20))
          done
          exit 1

      - name: Setup script.
        uses: actions/github-script@v8
        with:
          script: |
            async function execCmd(name, args) {
              const opts = {};
              let out = '';
              let err = '';
              opts.listeners = {
                stdout: (data) => {
                  out += data.toString();
                },
                stderr: (data) => {
                  process.stderr.write(data.toString());
                }
              };
              // opt.cwd = './lib';
              await exec.exec(name, args, opts);
              return out;
            }
            const version = await execCmd('zig', ['build', 'version']);
            const parts = version.split('.')
            const last_version = parts[0] + '.' + (parseInt(parts[1])-1)
            core.exportVariable('SHORT_VERSION', version);
            await execCmd('git', ['fetch', '--all', '--tags', '--force']);
            const build = await execCmd('git', ['rev-list', '--count', `${last_version}..${context.sha}`])
            core.exportVariable('BUILD', build.trim());
            core.exportVariable('COMMIT', context.sha.substring(0, 7));

      - name: Cache.
        uses: actions/cache@v5
        with:
          path: |-
            ~/.cache/zig
            .zig-cache
          key:
            build-1
          restore-keys:
            build-1

      - name: Build Cyber.
        run: zig build cli

      - name: Generate docs.
        run: |
          LD_LIBRARY_PATH=`pwd`/md4c/build/src zig-out/bin/cyber docs/gen-docs.cy -version="${{ format('v{0}-dev {1}-{2}', env.SHORT_VERSION, env.BUILD, env.COMMIT) }}"
          zig-out/bin/cyber docs/gen-api-json.cy -version="${{ format('v{0}-dev {1}-{2}', env.SHORT_VERSION, env.BUILD, env.COMMIT) }}"
          mkdir -p docs/public
          mv docs/docs.html docs/public/docs.html
          mv docs/api.html docs/public/api.html
          mv docs/api.json docs/public/api.json
          ln -sf docs.html docs/public/index.html

      # The playground is a static page that runs the WASI builds of the CLI and of the language server
      # in the browser. Both are built from this commit, so the page matches the docs next to it.
      - name: Build playground wasm.
        run: |
          zig build cli -Dtarget=wasm32-wasi -Doptimize=ReleaseSafe -p zig-out/playground
          zig build lsp -Dtarget=wasm32-wasi -Doptimize=ReleaseSafe -p zig-out/playground

      - name: Assemble playground.
        run: |
          mkdir -p docs/public/play
          cp examples/web-playground/index.html examples/web-playground/style.css docs/public/play/
          cp examples/web-playground/*.js docs/public/play/
          cp zig-out/playground/bin/cyber.wasm zig-out/playground/bin/cyber-lsp.wasm docs/public/play/

      - name: Deploy.
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/master'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/public
